# Cole estas linhas DENTRO da location / { ... } que JÁ EXISTE no seu
# nginx e que contém a linha "proxy_pass http://127.0.0.1:8501;" (ou porta
# equivalente do Streamlit). NÃO cole em outro lugar — sub_filter só
# funciona dentro da location que está fazendo o proxy.

proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter_types text/html;

sub_filter '<title>Streamlit</title>' '<title>Doce Cesta Brasília | Cestas de Café da Manhã e Presentes em Brasília - DF</title>';

