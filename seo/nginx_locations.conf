# Cole este bloco DENTRO do server{} do site www.docecestabrasilia.com.br,
# em qualquer lugar ANTES da location / que já existe (a que faz proxy_pass pro Streamlit).

location = /robots.txt {
    alias /var/www/docecestabrasilia/seo/robots.txt;
    default_type text/plain;
}

location = /sitemap.xml {
    alias /var/www/docecestabrasilia/seo/sitemap.xml;
    default_type application/xml;
}

# Imagem usada nas tags Open Graph / Twitter Card — serve direto do
# checkout do projeto, sem passar pelo Streamlit.
location /assets/ {
    alias /home/lafapereira/docecesta/assets/;
    expires 30d;
}
